<div class="space-y-6">
  <app-breadcrumb [items]="['SGDP', 'Cuentas de Cobro']" />

  <div>
    <h1 class="text-lg font-semibold text-slate-900">Consultar Cuentas de Cobro</h1>
    <p class="mt-1 text-sm text-slate-500">
      Módulo 6 — Gestión y seguimiento de cuentas de cobro emitidas a entidades.
    </p>
  </div>

  <div class="flex flex-wrap items-center gap-3 rounded-xl border border-slate-200 bg-white px-5 py-4">
    <span class="text-sm font-medium text-slate-600">Filtros:</span>
    <select
      class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-500 focus:border-slate-400 focus:outline-none"
    >
      <option>Todas las entidades</option>
    </select>
    <select
      class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-500 focus:border-slate-400 focus:outline-none"
    >
      <option>Cualquier estado</option>
    </select>
    <input
      type="date"
      class="rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-500 focus:border-slate-400 focus:outline-none"
    />
    <button
      type="button"
      class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800"
      (click)="buscar()"
    >
      Buscar
    </button>
    <span class="ml-auto text-xs font-medium text-slate-400">{{ cuentasCobro.length }} registros</span>
  </div>

  <app-table title="Historial de Cuentas de Cobro" [columns]="columns" [rows]="cuentasCobro">
    <div table-actions class="flex items-center gap-2">
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg border border-slate-200 px-3.5 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50"
        (click)="exportar()"
      >
        <svg lucideDownload class="h-4 w-4"></svg>
        Exportar CSV
      </button>
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800"
        (click)="generarCuenta()"
      >
        <svg lucidePlus class="h-4 w-4"></svg>
        Generar Cuenta
      </button>
    </div>

    <ng-template #rowActions let-row>
      <button
        type="button"
        class="rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-medium text-slate-600 transition-colors hover:bg-slate-50"
        (click)="verCuenta(row)"
      >
        Ver Cuenta
      </button>
    </ng-template>
  </app-table>

  <div
    class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-6 py-3.5 text-sm"
  >
    <span class="font-semibold text-slate-900">Total Emitido</span>
    <div class="flex flex-wrap items-center gap-8">
      <span class="font-semibold text-slate-900">{{ totalCapitalLabel }}</span>
      <span class="font-semibold text-slate-900">{{ totalInteresesLabel }}</span>
      <span class="text-slate-500">{{ resumenEstados }}</span>
    </div>
  </div>
</div>
