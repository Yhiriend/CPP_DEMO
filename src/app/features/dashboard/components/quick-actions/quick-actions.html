<div class="rounded-xl border border-slate-200 bg-white p-6 shadow-sm">
  <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Acciones Rápidas</h2>

  <div class="mt-4 flex flex-wrap gap-3">
    @for (action of actions(); track action.label) {
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-medium text-slate-700 transition-colors hover:border-slate-300 hover:bg-slate-50"
      >
        <svg [lucideIcon]="action.icon" class="h-4 w-4 text-slate-500"></svg>
        {{ action.label }}
      </button>
    }
  </div>
</div>
