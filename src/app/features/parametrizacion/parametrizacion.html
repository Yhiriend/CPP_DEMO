<div class="space-y-6">
  <app-breadcrumb [items]="['SGDP', 'Módulo 2', 'Parametrización']" />

  <div class="flex flex-wrap items-center gap-3">
    <h1 class="text-lg font-semibold text-slate-900">Módulo 2 — Parametrización</h1>
    <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium uppercase tracking-wide text-slate-500">
      Sub-módulo: {{ activeTabLabel() }}
    </span>
  </div>

  <div class="border-b border-slate-200">
    <div class="flex gap-1 overflow-x-auto">
      @for (tab of tabs; track tab.id) {
        <button
          type="button"
          (click)="selectTab(tab.id)"
          class="whitespace-nowrap rounded-t-lg border-b-2 px-4 py-2.5 text-sm font-medium transition-colors"
          [class]="
            tab.id === activeTabId()
              ? 'border-slate-900 text-slate-900'
              : 'border-transparent text-slate-400 hover:text-slate-600'
          "
        >
          {{ tab.label }}
        </button>
      }
    </div>
  </div>

  @if (activeTabId() === 'dtf-rate-settings') {
    <app-dtf-rate-settings />
  } @else {
    <div class="rounded-xl border border-dashed border-slate-300 bg-white p-12 text-center">
      <p class="text-sm font-medium text-slate-500">{{ activeTabLabel() }}</p>
      <p class="mt-1 text-xs text-slate-400">Este sub-módulo aún no está disponible.</p>
    </div>
  }

  <app-system-status-bar />
</div>
