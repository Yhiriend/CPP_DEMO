<div class="space-y-4">
  <div class="flex flex-wrap items-center gap-3 rounded-xl border border-slate-200 bg-white px-5 py-4">
    <div class="flex items-center gap-2 text-sm font-medium text-slate-600">
      <svg lucideSlidersHorizontal class="h-4 w-4 text-slate-400"></svg>
      Filtros avanzados:
    </div>
    <label class="flex items-center gap-2 text-sm text-slate-600">
      <input type="checkbox" checked class="rounded border-slate-300 text-slate-900 focus:ring-slate-400" />
      Obligaciones Pendientes
    </label>
    <label class="flex items-center gap-2 text-sm text-slate-600">
      <input type="checkbox" class="rounded border-slate-300 text-slate-900 focus:ring-slate-400" />
      Obligaciones Pagadas
    </label>
    <button
      type="button"
      class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800"
      (click)="aplicarFiltros()"
    >
      Aplicar Filtros
    </button>
    <div class="ml-auto flex items-center gap-3 text-xs text-slate-400">
      <span>{{ filasCartera.length }} entidades</span>
      <button
        type="button"
        class="font-medium text-slate-500 underline-offset-2 hover:text-slate-700 hover:underline"
        (click)="limpiarFiltros()"
      >
        Limpiar filtros
      </button>
    </div>
  </div>

  <app-table title="Detalle de Cartera por Entidad" [columns]="columns" [rows]="filasCartera">
    <div table-actions class="flex items-center gap-2">
      <span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-500">Solo lectura</span>
      <button
        type="button"
        class="flex items-center gap-2 rounded-lg bg-slate-900 px-3.5 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800"
        (click)="exportar()"
      >
        <svg lucideDownload class="h-4 w-4"></svg>
        Exportar Estado de Cuenta (Excel/PDF)
      </button>
    </div>

    <ng-template #rowActions let-row>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
        [attr.aria-label]="'Ver ficha de ' + row.nombre"
        [title]="'Ver ficha de ' + row.nombre"
        (click)="verFicha(row)"
      >
        <svg lucideExternalLink class="h-4 w-4"></svg>
      </button>
    </ng-template>
  </app-table>

  <div
    class="flex flex-wrap items-center justify-between gap-3 rounded-xl border border-slate-200 bg-slate-50 px-6 py-3.5 text-sm"
  >
    <span class="font-semibold text-slate-900">Total Consolidado</span>
    <div class="flex flex-wrap items-center gap-8">
      <span class="font-semibold text-slate-900">{{ totalObligaciones }} oblig.</span>
      <span class="font-semibold text-slate-900">{{ totalCapitalLabel }}</span>
      <span class="font-semibold text-slate-900">{{ totalInteresesLabel }}</span>
      <span class="font-semibold text-slate-900">{{ totalDeudaLabel }}</span>
    </div>
  </div>
</div>
