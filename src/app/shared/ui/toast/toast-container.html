<div class="pointer-events-none fixed inset-x-0 bottom-6 z-50 flex flex-col items-center gap-2 px-4">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      class="pointer-events-auto flex max-w-md items-center gap-2 rounded-lg bg-slate-900 px-4 py-2.5 text-sm font-medium text-white shadow-lg"
      role="status"
    >
      {{ toast.message }}
    </div>
  }
</div>
