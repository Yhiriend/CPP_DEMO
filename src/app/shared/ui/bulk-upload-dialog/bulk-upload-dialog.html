<app-modal [title]="title()" (close)="closed.emit()">
  <div modal-body class="space-y-4">
    <label
      class="flex cursor-pointer flex-col items-center gap-2 rounded-lg border border-dashed border-slate-300 bg-slate-50 p-6 text-center transition-colors hover:border-slate-400"
    >
      <svg lucideUpload class="h-6 w-6 text-slate-400"></svg>
      <span class="text-sm font-medium text-slate-700">
        {{ fileName() || 'Seleccionar archivo CSV' }}
      </span>
      <span class="text-xs text-slate-400">Columnas esperadas: {{ templateColumns().join(', ') }}</span>
      <input type="file" accept=".csv" class="hidden" (change)="onFileSelected($event)" />
    </label>

    @if (outcome(); as result) {
      <div class="flex items-center gap-4 text-sm">
        <span class="font-medium text-emerald-600">{{ result.valid.length }} exitosos</span>
        <span class="font-medium text-red-600">{{ result.rejected.length }} rechazados</span>
      </div>

      @if (result.rejected.length > 0) {
        <div class="max-h-40 overflow-y-auto rounded-lg border border-slate-200">
          <table class="w-full text-left text-xs">
            <thead class="bg-slate-50 text-slate-500">
              <tr>
                <th class="px-3 py-2 font-semibold uppercase tracking-wide">Fila</th>
                <th class="px-3 py-2 font-semibold uppercase tracking-wide">Motivo</th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
              @for (item of result.rejected; track item.row) {
                <tr>
                  <td class="px-3 py-1.5 text-slate-500">{{ item.row }}</td>
                  <td class="px-3 py-1.5 text-red-600">{{ item.reason }}</td>
                </tr>
              }
            </tbody>
          </table>
        </div>
      }
    }
  </div>

  <div modal-footer class="flex items-center gap-2">
    <button
      type="button"
      class="rounded-lg border border-slate-200 px-4 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-50"
      (click)="closed.emit()"
    >
      Cancelar
    </button>
    <button
      type="button"
      class="rounded-lg bg-slate-900 px-4 py-2 text-sm font-medium text-white transition-colors hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
      [disabled]="!outcome() || outcome()!.valid.length === 0"
      (click)="confirm()"
    >
      Cargar {{ outcome()?.valid?.length ?? 0 }} registros
    </button>
  </div>
</app-modal>
