<div
  class="fixed inset-0 z-40 flex items-center justify-center bg-slate-900/50 p-4"
  (click)="close.emit()"
>
  <div
    class="w-full max-w-lg rounded-xl bg-white shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <div class="flex items-center justify-between border-b border-slate-200 px-6 py-4">
      <h2 class="text-base font-semibold text-slate-900">{{ title() }}</h2>
      <button
        type="button"
        class="flex h-8 w-8 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
        aria-label="Cerrar"
        (click)="close.emit()"
      >
        <svg lucideX class="h-4 w-4"></svg>
      </button>
    </div>

    <div class="max-h-[70vh] overflow-y-auto px-6 py-5">
      <ng-content select="[modal-body]" />
    </div>

    <div class="flex items-center justify-end gap-2 border-t border-slate-200 px-6 py-4">
      <ng-content select="[modal-footer]" />
    </div>
  </div>
</div>
