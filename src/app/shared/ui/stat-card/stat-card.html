<div class="rounded-xl border border-slate-200 bg-white p-5 shadow-sm">
  <div class="flex items-center justify-between">
    <p class="text-sm font-medium text-slate-500">{{ stat().label }}</p>
    @if (stat().icon; as icon) {
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-slate-100 text-slate-500">
        <svg [lucideIcon]="icon" class="h-4 w-4"></svg>
      </div>
    }
  </div>

  <p class="mt-2 text-2xl font-semibold text-slate-900">{{ stat().value }}</p>

  @if (stat().subtitle; as subtitle) {
    <p class="mt-2 text-xs text-slate-400">{{ subtitle }}</p>
  }
</div>
