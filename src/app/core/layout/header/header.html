<header class="flex items-center justify-between gap-4 border-b border-slate-200 bg-white px-6 py-4">
  <label class="relative flex w-full max-w-md items-center">
    <svg lucideSearch class="pointer-events-none absolute left-3 h-4 w-4 text-slate-400"></svg>
    <input
      type="search"
      placeholder="Buscar entidades, pagos, acuerdos..."
      class="w-full rounded-lg border border-slate-200 bg-slate-50 py-2 pl-9 pr-3 text-sm text-slate-700 placeholder:text-slate-400 focus:border-slate-400 focus:bg-white focus:outline-none"
    />
  </label>

  <button
    type="button"
    class="relative flex h-9 w-9 shrink-0 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100"
    aria-label="Notificaciones"
    (click)="showNotifications()"
  >
    <svg lucideBell class="h-5 w-5"></svg>
    <span class="absolute right-2 top-2 h-1.5 w-1.5 rounded-full bg-red-500"></span>
  </button>
</header>
