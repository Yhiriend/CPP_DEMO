<aside class="flex h-full w-64 shrink-0 flex-col border-r border-slate-200 bg-white">
  <div class="flex items-center gap-2 px-6 py-5">
    <div class="flex h-9 w-9 items-center justify-center rounded-lg bg-slate-900 text-sm font-bold text-white">
      CP
    </div>
    <span class="text-lg font-semibold text-slate-900">CPP</span>
  </div>

  <nav class="flex-1 overflow-y-auto px-4 pb-4">
    <p class="px-2 pb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">Menú</p>
    <ul class="space-y-1">
      @for (item of navItems; track item.path) {
        <li>
          @if (item.implemented) {
            <a
              [routerLink]="item.path"
              routerLinkActive="bg-slate-900 text-white hover:bg-slate-900"
              class="flex items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100"
            >
              <svg [lucideIcon]="item.icon" class="h-5 w-5 shrink-0"></svg>
              <span>{{ item.label }}</span>
            </a>
          } @else {
            <span
              class="flex cursor-not-allowed items-center gap-3 rounded-lg px-3 py-2 text-sm font-medium text-slate-400"
              [title]="item.label + ' (próximamente)'"
            >
              <svg [lucideIcon]="item.icon" class="h-5 w-5 shrink-0"></svg>
              <span>{{ item.label }}</span>
            </span>
          }
        </li>
      }
    </ul>
  </nav>

  <div class="flex items-center gap-3 border-t border-slate-200 px-4 py-4">
    <div class="flex h-9 w-9 items-center justify-center rounded-full bg-slate-200 text-sm font-semibold text-slate-600">
      AD
    </div>
    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-medium text-slate-900">Usuario Demo</p>
      <p class="truncate text-xs text-slate-400">Administrador</p>
    </div>
    <button
      type="button"
      (click)="logout()"
      class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg text-slate-400 transition-colors hover:bg-slate-100 hover:text-slate-600"
      title="Cerrar sesión"
      aria-label="Cerrar sesión"
    >
      <svg [lucideIcon]="'log-out'" class="h-4 w-4"></svg>
    </button>
  </div>
</aside>
